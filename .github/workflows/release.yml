name: Release

# Run by hand from the Actions tab on `main`, with the version to publish.
# It checks the commit, runs the merge gate, packs and checks the package,
# tags the commit, publishes it to nuget.org (Trusted Publishing), and creates
# the GitHub Release. CONTRIBUTING.md "Versions" says what must be true first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (the VersionPrefix of src/Txfio/Txfio.csproj, without v)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Run this workflow on main, not ${GITHUB_REF}." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: .github/scripts/release-check.sh "$VERSION"

  test:
    name: test
    needs: verify
    uses: ./.github/workflows/build.yml

  pack:
    name: pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - run: dotnet pack src/Txfio/Txfio.csproj -c Release -p:ContinuousIntegrationBuild=true
      - run: .github/scripts/release-check-package.sh "$VERSION" "$GITHUB_SHA" src/Txfio/bin/Release
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            src/Txfio/bin/Release/Txfio.${{ inputs.version }}.nupkg
            src/Txfio/bin/Release/Txfio.${{ inputs.version }}.snupkg
          if-no-files-found: error

  publish:
    name: publish
    needs: pack
    runs-on: ubuntu-latest
    # The environment that the nuget.org Trusted Publishing policy is registered with.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: package
      # Push the tag before the publish: a tag can be deleted, a nuget.org
      # version cannot.
      - name: Tag the commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
      # Request the short-lived key right before the push; it is valid for one hour.
      - uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile that owns Txfio and the Trusted Publishing policy.
          user: YUKIKEDA
      # The snupkg beside the nupkg is pushed with it.
      - run: >-
          dotnet nuget push "package/Txfio.${VERSION}.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The property starts with the line break after the XML tag; drop leading blank lines.
          dotnet msbuild src/Txfio/Txfio.csproj -getProperty:PackageReleaseNotes | sed -e '/[^[:space:]]/,$!d' > notes.md
          gh release create "v${VERSION}" --verify-tag --title "Txfio ${VERSION}" --notes-file notes.md \
            "package/Txfio.${VERSION}.nupkg" "package/Txfio.${VERSION}.snupkg"
