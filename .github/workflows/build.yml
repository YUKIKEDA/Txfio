# CI: the merge gate. Both jobs must be green.
# Windows runs ./build.ps1 (all unit tests, including WindowsFact).
# Linux runs the same steps directly; WindowsFact tests are skipped there.
# Stress tests (tests/Txfio.Stress) are not run here.
# release.yml calls this workflow to run the same gate on the commit it publishes.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Gate script
        shell: pwsh
        run: ./build.ps1

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore
        run: dotnet restore Txfio.slnx
      - name: Format
        run: dotnet format Txfio.slnx --verify-no-changes
      - name: Build
        run: dotnet build Txfio.slnx --no-restore -c Release
      - name: Test
        run: dotnet test tests/Txfio.Tests/Txfio.Tests.csproj --no-build -c Release
