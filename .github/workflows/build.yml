# CI

# NOTE: GitHub Actions may be unavailable due to account/org limits.
# Local gate of record is ./build.ps1 — do not treat this workflow as required green
# until Actions are confirmed working.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Local gate script
        shell: pwsh
        run: ./build.ps1
