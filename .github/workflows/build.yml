# CI: the merge gate. Both jobs must be green.
# Windows runs ./build.ps1 (all unit tests, including WindowsFact).
# Linux runs the same steps directly; WindowsFact tests are skipped there.
# Stress tests (tests/Txfio.Stress) are not run here.
# release.yml calls this workflow to run the same gate on the commit it publishes,
# and dispatches it on the release branch, whose pull request GITHUB_TOKEN opens
# without starting workflows.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Gate script
        shell: pwsh
        run: ./build.ps1
      - name: Pack
        run: dotnet pack src/Txfio/Txfio.csproj -c Release
      # The packed nupkg, used from a consumer project outside the Txfio namespace (#337).
      - name: Package smoke test
        shell: bash
        run: .github/scripts/package-smoke-test.sh "$(dotnet msbuild src/Txfio/Txfio.csproj -getProperty:Version | tr -d '\r')" src/Txfio/bin/Release

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Restore
        run: dotnet restore Txfio.slnx
      - name: Format
        run: dotnet format Txfio.slnx --verify-no-changes
      - name: Build
        run: dotnet build Txfio.slnx --no-restore -c Release
      - name: Test
        run: dotnet test tests/Txfio.Tests/Txfio.Tests.csproj --no-build -c Release
      - name: README samples
        run: .github/scripts/readme-samples-check.sh
      - name: Pack
        run: dotnet pack src/Txfio/Txfio.csproj --no-build -c Release
      - name: Package smoke test
        run: .github/scripts/package-smoke-test.sh "$(dotnet msbuild src/Txfio/Txfio.csproj -getProperty:Version)" src/Txfio/bin/Release
